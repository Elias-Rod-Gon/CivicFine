<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicFine - Panel Principal</title>
  <link rel="stylesheet" href="main_screen_user.css">
</head>
<body>

  <div class="app-container">

    <!-- ENCABEZADO -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-badge">Zapopan</span>
        <h1 class="brand-title">CivicFine</h1>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn" aria-label="Notificaciones">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
        <a href="/perfil.html" class="avatar-link" aria-label="Ir al perfil">
          <span class="avatar" id="user-avatar-initials">--</span>
        </a>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content" id="main-content-area">

      <!-- PERFIL DE RESUMEN -->
      <section class="user-summary" aria-labelledby="greeting-heading">
        <div class="user-info">
          <h2 id="greeting-heading">Hola, <span id="user-name">Cargando...</span></h2>
          <address class="location-text">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span id="user-location">Consultando ubicación...</span>
          </address>
        </div>
        <span class="status-indicator" id="user-status-dot" title="Estado de la cuenta"></span>
      </section>

      <!-- TARJETAS DE ESTADÍSTICAS -->
      <section class="stats-grid" aria-label="Estadísticas de reportes">

        <article class="stat-card">
          <header class="stat-header">
            <span class="stat-label">ENVIADOS</span>
            <div class="stat-icon icon-blue">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </div>
          </header>
          <div class="stat-body">
            <span class="stat-value" id="stat-sent-count">0</span>
            <span class="stat-period">Este mes</span>
          </div>
        </article>

        <article class="stat-card">
          <header class="stat-header">
            <span class="stat-label">MULTADOS</span>
            <div class="stat-icon icon-red">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 13l5 5m0 0l-2 2m2-2l-2-2m-7 7l9-9a2.828 2.828 0 0 0-4-4l-9 9m4 4L4 20l1-4m4 4l-4-4"></path></svg>
            </div>
          </header>
          <div class="stat-body">
            <span class="stat-value" id="stat-fined-count">0</span>
            <span class="stat-effectiveness" id="stat-effectiveness">0% efectividad</span>
          </div>
        </article>

      </section>

      <!-- BANNER DISCRETO -->
      <aside class="info-banner">
        <p><strong>Vialidad segura:</strong> Los reportes se procesan en un lapso estimado de 15 minutos.</p>
      </aside>

      <!-- SECCIÓN DINÁMICA DE REPORTES -->
      <section class="reports-section" aria-labelledby="reports-heading">
        <header class="reports-header">
          <h3 id="reports-heading">Reportes recientes</h3>
          <a href="/historial.html" class="link-all">Historial completo</a>
        </header>

        <!-- FILTROS -->
        <nav class="filter-pills" aria-label="Filtrar reportes">
          <button type="button" class="pill active" data-filter="all">
            Todos (<span id="filter-all-count">0</span>)
          </button>
          <button type="button" class="pill" data-filter="in_progress">
            En curso (<span id="filter-progress-count">0</span>)
          </button>
          <button type="button" class="pill" data-filter="resolved">
            Resueltos (<span id="filter-resolved-count">0</span>)
          </button>
        </nav>

        <!-- CONTENEDOR DINÁMICO (VACÍO POR DEFECTO) -->
        <div class="reports-list" id="reports-container">
          <!-- JS renderiza contenido o Empty State -->
        </div>
      </section>

      <!-- BOTÓN PRINCIPAL DE ACCIÓN -->
      <div class="action-button-wrapper" id="action-btn-wrapper">
        <a href="/nuevo-reporte.html" class="btn-primary" id="btn-create-report">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nuevo reporte
        </a>
      </div>

    </main>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav class="bottom-nav">
      <a href="/index.html" class="nav-item active">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Inicio</span>
      </a>

      <a href="/nuevo-reporte.html" class="nav-item nav-item-main" id="nav-new-report-link">
        <div class="nav-icon-circle">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </div>
        <span>Reportar</span>
      </a>

      <a href="/perfil.html" class="nav-item">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Perfil</span>
      </a>
    </nav>

  </div>

  <script src="main_screen_user.js"></script>
</body>
</html>
