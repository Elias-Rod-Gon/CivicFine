<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicFine - Mis Denuncias</title>
  <link rel="stylesheet" href="main_screen_user.css">
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>

  <!-- Encabezado Móvil -->
  <div class="mobile-header">
    <h2>CivicFine</h2>
    <div class="header-acciones">
      <a href="perfil.html" class="btn-perfil" aria-label="Mi perfil" title="Mi perfil">
        <span class="icono-perfil" aria-hidden="true">👤</span>
        <span class="user-badge" id="header-user-name">...</span>
      </a>
    </div>
  </div>

  <div class="app-container">

    <header class="topbar">
      <div class="user-profile-info">
        <span class="sector-label" id="user-sector">📍 Municipio no asignado</span>
        <h1 id="user-display-name">Bienvenido/a</h1>
      </div>
      <button type="button" class="btn-logout" id="btn-cerrar-sesion">Cerrar sesión</button>
    </header>

    <main class="content">

      <form id="dashboard-controls" class="dashboard-form">
        <input type="radio" name="filter-tab" id="tab-todos" class="tab-radio" checked>
        <input type="radio" name="filter-tab" id="tab-revision" class="tab-radio">
        <input type="radio" name="filter-tab" id="tab-resueltos" class="tab-radio">

        <section class="kpi-grid">
          <article class="kpi-card orange">
            <small>PENDIENTES / EN REVISIÓN</small>
            <strong id="kpi-pendientes">0</strong>
            <span>En proceso por la autoridad</span>
          </article>

          <article class="kpi-card green">
            <small>REPORTES VALIDADOS</small>
            <strong id="kpi-validados">0</strong>
            <span>Boletas de infracción emitidas</span>
          </article>
        </section>

        <nav class="filter-nav" aria-label="Filtro de reportes">
          <label for="tab-todos" class="filter-btn" id="lbl-todos">Todos (0)</label>
          <label for="tab-revision" class="filter-btn" id="lbl-revision">En revisión (0)</label>
          <label for="tab-resueltos" class="filter-btn" id="lbl-resueltos">Resueltos (0)</label>
        </nav>

        <section class="reports-section">
          <div id="container-reportes" class="reports-list"></div>
        </section>
      </form>

    </main>

    <a href="formulario.html" class="fab-new-report" aria-label="Registrar nueva denuncia">➕</a>

  </div>

  <!-- Vista de detalle del reporte -->
  <div id="modal-detalle" class="modal-detalle" hidden>
    <div class="modal-contenido">
      <header class="modal-header">
        <button type="button" id="btn-cerrar-detalle" class="btn-back-detalle">← Volver</button>
        <h2>Detalle de Reporte</h2>
      </header>

      <div class="modal-body">
        <div class="detalle-foto-wrap">
          <img id="det-foto" class="detalle-foto" alt="Evidencia del reporte" style="display: none;">
        </div>

        <p class="detalle-folio" id="det-folio"></p>
        <span class="badge-status" id="det-estado"></span>

        <div class="detalle-card">
          <small>Infracción</small>
          <strong id="det-infraccion"></strong>
        </div>

        <div class="detalle-card">
          <small>Placa detectada</small>
          <strong id="det-placa"></strong>
          <small>Fecha y hora</small>
          <span id="det-fecha"></span>
          <small>Ubicación</small>
          <span id="det-direccion"></span>
        </div>

        <div class="detalle-mapa">
          <iframe id="det-mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <div class="detalle-card">
          <small>Observaciones</small>
          <span id="det-descripcion"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="main_screen_user.js"></script>
</body>
</html>
