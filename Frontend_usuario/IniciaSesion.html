<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicFine - Acceso al Sistema</title>
  <link rel="stylesheet" href="IniciaSesion.css">
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>

  <!-- ENCABEZADO INSTITUCIONAL -->
  <header class="site-header">
    <div class="header-brand">
      <h1>CivicFine</h1>
      <span>Portal Ciudadano</span>
    </div>
  </header>

  <main class="auth-wrapper">
    <article class="auth-card">

      <header class="auth-header">
        <h2>Acceso al Sistema</h2>
        <p>Ingrese sus credenciales para consultar o registrar reportes viales.</p>
      </header>

      <!-- Tabs de navegación (Controlados por CSS) -->
      <input type="radio" name="auth-mode" id="mode-login" class="mode-radio" checked>
      <input type="radio" name="auth-mode" id="mode-register" class="mode-radio">

      <nav class="auth-tabs" aria-label="Selección de modo de acceso">
        <label for="mode-login" class="tab-btn">Iniciar Sesión</label>
        <label for="mode-register" class="tab-btn">Crear Cuenta</label>
      </nav>

      <!-- 1. INICIO DE SESIÓN -->
      <form id="form-login" class="auth-form form-login-view" novalidate>

        <div class="form-group">
          <label for="login-telefono">Número Telefónico (10 dígitos) *</label>
          <div class="input-prefix-group">
            <span class="prefix">+52</span>
            <input
              type="tel"
              id="login-telefono"
              placeholder="3331234567"
              maxlength="10"
              pattern="[0-9]{10}"
              required
              autocomplete="tel-national"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="login-contrasena">Contraseña *</label>
          <input
            type="password"
            id="login-contrasena"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-primary" id="btn-login-submit">
          Ingresar al Portal
        </button>

      </form>

      <!-- 2. REGISTRO -->
      <form id="form-registro" class="auth-form form-register-view" novalidate>

        <div class="form-group">
          <label for="reg-nombre">Nombre(s) *</label>
          <input type="text" id="reg-nombre" placeholder="Ej. Juan" required autocomplete="given-name">
        </div>

        <div class="form-group">
          <label for="reg-apellidos">Apellidos *</label>
          <input type="text" id="reg-apellidos" placeholder="Ej. Pérez Pereira" required autocomplete="family-name">
        </div>

        <div class="form-group">
          <label for="reg-correo">Correo Electrónico *</label>
          <input type="email" id="reg-correo" placeholder="juan.perez@ejemplo.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="reg-telefono">Número Telefónico (10 dígitos) *</label>
          <div class="input-prefix-group">
            <span class="prefix">+52</span>
            <input
              type="tel"
              id="reg-telefono"
              placeholder="3331234567"
              maxlength="10"
              pattern="[0-9]{10}"
              required
              autocomplete="tel-national"
            >
          </div>
          <small class="field-hint" id="hint-telefono-check">Se verificará disponibilidad en la base de datos.</small>
        </div>

        <div class="form-group">
          <label for="reg-contrasena">Contraseña *</label>
          <input type="password" id="reg-contrasena" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <button type="submit" class="btn-primary" id="btn-register-submit">
          Registrar y Acceder
        </button>

      </form>

      <footer class="auth-footer">
        <small>Plataforma Institucional para la Movilidad Segura.</small>
      </footer>

    </article>
  </main>

  <script src="IniciaSesion.js"></script>
</body>
</html>
